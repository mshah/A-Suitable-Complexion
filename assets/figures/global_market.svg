<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="695" viewBox="0 0 1400 695" role="img" aria-labelledby="title desc">
<title id="title">Global skin-lightening product market estimate and forecasts</title><desc id="desc">Grand View Research figures: 2023 estimated 11.2 billion US dollars, 2026 forecast 13.2 billion, 2030 forecast 16.1 billion; product category includes pigmentation care.</desc>
<rect width="1400" height="695" fill="#F7F2E8"/>
<text x="72" y="85" font-size="43" font-family="Georgia, serif" fill="#24211E">How large is the market?</text>
<text x="72" y="125" font-size="21" font-family="Arial, sans-serif" fill="#60564F">Global products classified as skin-lightening · US$ billions</text>
<text x="72" y="225" font-size="23" font-family="Arial,sans-serif" fill="#26211F">2023</text>
<rect x="190" y="188" width="1030" height="58" rx="5" fill="#EBDFCF"/>
<rect x="190" y="188" width="628" height="58" rx="5" fill="#926143"/>
<text x="838" y="226" font-size="27" font-family="Arial,sans-serif" font-weight="bold" fill="#25211F">$11.2bn</text>
<text x="190" y="278" font-size="17" font-family="Arial,sans-serif" fill="#675E56">2023 estimate</text>
<text x="72" y="351" font-size="23" font-family="Arial,sans-serif" fill="#26211F">2026</text>
<rect x="190" y="314" width="1030" height="58" rx="5" fill="#EBDFCF"/>
<rect x="190" y="314" width="740" height="58" rx="5" fill="#AC7953"/>
<text x="950" y="352" font-size="27" font-family="Arial,sans-serif" font-weight="bold" fill="#25211F">$13.2bn</text>
<text x="190" y="404" font-size="17" font-family="Arial,sans-serif" fill="#675E56">2026 projection</text>
<text x="72" y="477" font-size="23" font-family="Arial,sans-serif" fill="#26211F">2030</text>
<rect x="190" y="440" width="1030" height="58" rx="5" fill="#EBDFCF"/>
<rect x="190" y="440" width="903" height="58" rx="5" fill="#C99870"/>
<text x="1113" y="478" font-size="27" font-family="Arial,sans-serif" font-weight="bold" fill="#25211F">$16.1bn</text>
<text x="190" y="530" font-size="17" font-family="Arial,sans-serif" fill="#675E56">2030 projection</text>
<path d="M72 586 H1320" stroke="#CBBEAF" stroke-width="2"/>
<text x="72" y="619" font-size="18" font-family="Arial,sans-serif" fill="#33302C">Asia-Pacific: 54.8% of the same estimated global category in 2023.</text>
<text x="72" y="651" font-size="16" font-family="Arial,sans-serif" fill="#655D57">Source: Grand View Research [S13]. Commercial estimates and projections; not audited sales.</text>
<text x="72" y="674" font-size="15" font-family="Arial,sans-serif" fill="#655D57">Includes products for uneven pigmentation and dark spots; not solely colorism-driven purchases.</text>
</svg>